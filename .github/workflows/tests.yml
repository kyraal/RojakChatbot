name: Python tests
on:
  push:
    branches: ["main", "feature/rojak-learning-loop"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn pytest
      - name: Run Python tests
        run: pytest -q
      - name: Check Python syntax
        run: python -m py_compile web_app.py learning.py nlp_engine.py
      - name: Check browser JavaScript syntax
        run: |
          node --check web/app.js
          python - <<'PY'
          from pathlib import Path
          html = Path("web/admin.html").read_text(encoding="utf-8")
          start = html.index("<script>") + len("<script>")
          end = html.index("</script>", start)
          Path("/tmp/admin-dashboard.js").write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/admin-dashboard.js
